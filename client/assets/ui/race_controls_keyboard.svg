<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><rect width="1200" height="460" rx="22" fill="#111e33"/><g font-family="Noto Sans CJK JP,Noto Sans JP,sans-serif" fill="#f5f8ff" text-anchor="middle"><text x="600" y="43" font-size="29">キーボード：ひし形の並びはパッドと共通</text><rect x="258" y="126" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="290" y="166" font-size="28">S</text><text x="290" y="101" font-size="25">視点を切り替え</text><rect x="180" y="204" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="212" y="244" font-size="28">Z</text><text x="93" y="243" font-size="25">ブースト</text><rect x="336" y="204" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="368" y="244" font-size="28">C</text><text x="495" y="243" font-size="25">ダッシュ</text><rect x="258" y="282" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="290" y="322" font-size="28">X</text><text x="290" y="385" font-size="25">ブレーキ（長押し）</text><rect x="783" y="130" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="815" y="170" font-size="28">↑</text><rect x="705" y="208" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="737" y="248" font-size="28">←</text><rect x="783" y="208" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="815" y="248" font-size="28">↓</text><rect x="861" y="208" width="64" height="60" rx="10" fill="#334860" stroke="#a5bad2" stroke-width="2"/><text x="893" y="248" font-size="28">→</text><text x="815" y="101" font-size="25">ノッチを上げる</text><text x="815" y="323" font-size="25">↓：ノッチを下げる</text><text x="815" y="367" font-size="25">← →：ライン左右</text><text x="290" y="432" font-size="22">Spaceでもブレーキ</text><text x="880" y="432" font-size="22">Esc：一時停止   R：視点を戻す</text></g></svg>

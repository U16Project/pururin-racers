vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>\n// 新しい版の受け取り。ゲームのファイルは端末が覚え込むので、そのままだと、新しい版を上げても古い版が出続ける。\n// ・開いたとき、もう受け取り終わっている新しい版があれば、すぐ切り替えて読み込み直す。\n// ・遊んでいる途中で受け取り終わったら、勝手には切り替えず、上に知らせを出す（押すと切り替える）。\n(function () {\n	if (!('serviceWorker' in navigator)) { return; }\n	function apply(worker) { worker.postMessage('update'); }\n	function offer(worker) {\n		if (document.getElementById('pururin-update')) { return; }\n		var bar = document.createElement('button');\n		bar.id = 'pururin-update';\n		bar.textContent = '新しい版があります。ここを押すと、更新します。';\n		bar.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:1000;padding:10px 18px;font-size:16px;color:#fff;background:#2e6b94;border:2px solid #ffdb4d;border-radius:10px;cursor:pointer;';\n		bar.onclick = function () { bar.textContent = '更新しています…'; apply(worker); };\n		document.body.appendChild(bar);\n	}\n	function watch(reg) {\n		if (!reg) { return; }\n		if (reg.waiting && navigator.serviceWorker.controller) { apply(reg.waiting); return; }\n		reg.addEventListener('updatefound', function () {\n			var worker = reg.installing;\n			if (!worker) { return; }\n			worker.addEventListener('statechange', function () {\n				if (worker.state === 'installed' && navigator.serviceWorker.controller) { offer(worker); }\n			});\n		});\n		reg.update().catch(function () {});\n	}\n	window.addEventListener('load', function () {\n		navigator.serviceWorker.getRegistration().then(watch).catch(function () {});\n	});\n})();\n</script>"
